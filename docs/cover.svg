<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SetTrack — Own your next set.</title>
  <desc id="desc">A cyan orbital strength mark on a dark training dashboard, with the words Offline strength-training journal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#101d2d"/><stop offset=".6" stop-color="#080f19"/><stop offset="1" stop-color="#122d36"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#65dfe3" stop-opacity=".13"/><stop offset="1" stop-color="#65dfe3" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1278" height="318" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <ellipse cx="1065" cy="164" rx="290" ry="260" fill="url(#glow)"/>
    <g stroke="#2b4052" stroke-opacity=".45">
      <path d="M800 0V320M880 0V320M960 0V320M1040 0V320M1120 0V320M1200 0V320M760 80H1280M760 160H1280M760 240H1280"/>
      <circle cx="1060" cy="160" r="130"/><circle cx="1060" cy="160" r="106"/><circle cx="1060" cy="160" r="82"/>
    </g>
    <circle cx="1060" cy="160" r="130" stroke="#65dfe3" stroke-width="2" stroke-dasharray="190 628" transform="rotate(-126 1060 160)"/>
    <circle cx="1060" cy="160" r="106" stroke="#8194b1" stroke-width="2" stroke-dasharray="140 526" transform="rotate(2 1060 160)"/>
    <g stroke="#65dfe3" stroke-width="5" stroke-linecap="round"><path d="M1024 178V157M1042 178V145M1060 178V133M1078 178V119M1096 178V104"/></g>
    <path d="M1019 194H1102" stroke="#65dfe3" stroke-opacity=".4"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="56" y="66" fill="#65dfe3" font-size="14" letter-spacing="3">SETTRACK / TRAINING JOURNAL</text>
      <text x="52" y="154" fill="#edf5fc" font-size="64" font-weight="700" letter-spacing="-2">Own your next set.</text>
      <text x="56" y="202" fill="#afbdcd" font-size="22">A clear view of your strength. A journal that stays yours.</text>
      <g font-size="12" letter-spacing="1.5" fill="#65dfe3">
        <rect x="56" y="242" width="138" height="30" rx="15" fill="#15343d"/><text x="76" y="262">OFFLINE FIRST</text>
        <rect x="206" y="242" width="145" height="30" rx="15" fill="#15343d"/><text x="226" y="262">DEVICE STORED</text>
        <rect x="363" y="242" width="130" height="30" rx="15" fill="#15343d"/><text x="383" y="262">NO ACCOUNT</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="318" rx="24" stroke="#2b4052"/>
</svg>
